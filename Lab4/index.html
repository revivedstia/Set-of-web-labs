<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Журнал студентов</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Журнал студентов</h1>

    <section class="controls">
      <label for="pass-score">Проходной балл</label>
      <input id="pass-score" type="text" inputmode="decimal" value="60" autocomplete="off">
      <p id="pass-error" class="error" role="alert"></p>
    </section>

    <section>
      <h2>Добавить студента</h2>
      <form id="add-form" novalidate>
        <div class="field">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="score">Балл (0–100)</label>
          <input id="score" name="score" type="text" inputmode="decimal" autocomplete="off">
        </div>
        <button type="submit" class="primary">Добавить</button>
        <p id="form-error" class="error" role="alert"></p>
      </form>
    </section>

    <section>
      <h2>Журнал</h2>
      <p id="counts"></p>
      <table id="journal">
        <thead><tr><th>Имя</th><th>Балл</th><th>Статус</th><th><span class="sr-only">Действия</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" hidden>Записей нет. Добавьте студента через форму выше.</p>
      <details id="rejected-box" hidden>
        <summary>Отклонённые записи</summary>
        <ul id="rejected"></ul>
      </details>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
